name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # CI'da haqiqiy kalitlar kerak emas: hamma tekshiruv LLM'siz ishlaydi
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "False"
      LLM_API_KEY: ci-dummy-key
      LLM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
      LLM_MODEL: ci-dummy-model
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Django sozlamalarini tekshirish
        run: python manage.py check

      - name: Migratsiyalar modellarga mos ekanini tekshirish
        run: python manage.py makemigrations --check --dry-run

      - name: Testlar
        run: python manage.py test

      - name: Baholash to'plami to'g'riligi (LLM chaqirilmaydi)
        run: python manage.py eval_agent --validate

      - name: Agent grafi yig'ilishini tekshirish (LLM chaqirilmaydi)
        run: python manage.py show_graph

      - name: Telegram bot kodida sintaksis xatosi yo'qligini tekshirish
        run: python -m compileall -q telegram_bot
